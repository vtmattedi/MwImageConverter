version: "3.8"

services:
  mwimageconverter:
    build:
      context: .
      dockerfile: ./dockerfile
    image: mwimageconverter:latest
    container_name: mwimageconverter
    restart: unless-stopped
    expose:
      - "4173"
    # Uncomment and adjust ports if your app listens on a port
    # Uncomment to mount project into container for development
    # volumes:
    #   - ./:/app
